version: "3.8"

services:
  rag-backend:
    build: .
    container_name: agentic-rag-backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      - n8n

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: agentic-rag-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_PORT=5678
      - GENERIC_TIMEZONE=UTC
    volumes:
      - n8n_storage:/home/node/.n8n
    restart: unless-stopped

volumes:
  n8n_storage: